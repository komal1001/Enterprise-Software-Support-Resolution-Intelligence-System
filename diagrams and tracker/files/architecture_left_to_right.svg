<svg width="1480" height="470" viewBox="0 0 1480 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Enterprise Software Support and Resolution Intelligence System - left to right flow</title>
<desc>Left to right flow: React frontend, entry (FastAPI and input guardrails), Agent 1, four routing rows each ending in Agent 4 (and Agent 5 for the multi-agent row), output guardrails, Langfuse, and an outcome split into Resolved (which loops back to the React frontend via the line across the top) and Escalated (which continues to a human escalation column). PostgreSQL with pgvector and Azure OpenAI sit above Agent 1 and the routes column as resources called during routing.</desc>
<style>
.pagebg{fill:#FFFFFF}
.box-gray{fill:#F8F7F4;stroke:#B4B2A9}
.box-purple{fill:#EEEDFE;stroke:#534AB7}
.box-teal{fill:#E1F5EE;stroke:#0F6E56}
.box-success{fill:#EAF3DE;stroke:#3B6D11}
.box-danger{fill:#FAECE7;stroke:#993C1D}
text{font-family:'Helvetica Neue',Arial,sans-serif}
.t-title{font-size:14px;font-weight:600;fill:#2C2C2A}
.t-body{font-size:12px;font-weight:400;fill:#5F5E5A}
.t-small{font-size:11px;font-weight:400;fill:#5F5E5A}
.t-rt{font-size:12px;font-weight:600;fill:#3C3489}
.t-title-purple{font-size:14px;font-weight:600;fill:#3C3489}
.t-body-purple{font-size:12px;font-weight:400;fill:#534AB7}
.t-title-teal{font-size:14px;font-weight:600;fill:#085041}
.t-body-teal{font-size:12px;font-weight:400;fill:#0F6E56}
.t-title-success{font-size:14px;font-weight:600;fill:#27500A}
.t-body-success{font-size:12px;font-weight:400;fill:#3B6D11}
.t-title-danger{font-size:14px;font-weight:600;fill:#712B13}
.t-body-danger{font-size:12px;font-weight:400;fill:#993C1D}
.divider{stroke:#D3D1C7;stroke-width:0.5}
.conn{stroke:#888780;stroke-width:1.5;fill:none}
.condash{stroke:#888780;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.loop{stroke:#639922;stroke-width:2;fill:none}
.t-loop{font-size:11px;fill:#639922}
@media (prefers-color-scheme: dark) {
.pagebg{fill:#1F1E1C}
.box-gray{fill:#2C2C2A;stroke:#5F5E5A}
.box-purple{fill:#3C3489;stroke:#7F77DD}
.box-teal{fill:#085041;stroke:#1D9E75}
.box-success{fill:#27500A;stroke:#639922}
.box-danger{fill:#712B13;stroke:#D85A30}
.t-title{fill:#F1EFE8}
.t-body{fill:#B4B2A9}
.t-small{fill:#B4B2A9}
.t-rt{fill:#CECBF6}
.t-title-purple{fill:#CECBF6}
.t-body-purple{fill:#AFA9EC}
.t-title-teal{fill:#9FE1CB}
.t-body-teal{fill:#5DCAA5}
.t-title-success{fill:#C0DD97}
.t-body-success{fill:#97C459}
.t-title-danger{fill:#F5C4B3}
.t-body-danger{fill:#F0997B}
.divider{stroke:#444441}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="pagebg" x="0" y="0" width="1480" height="470"/>

<path d="M1215 130 L1215 0 L75 0 L75 130" class="loop" marker-end="url(#arrowg)"/>
<text class="t-loop" x="645" y="14" text-anchor="middle">Resolved (~87%) loops back to React frontend</text>

<rect class="box-teal" x="380" y="30" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="t-title-teal" x="455" y="46" text-anchor="middle" font-size="13">PostgreSQL +</text>
<text class="t-title-teal" x="455" y="62" text-anchor="middle" font-size="13">pgvector</text>
<text class="t-body-teal" x="455" y="78" text-anchor="middle" font-size="11">Vector store +</text>
<text class="t-body-teal" x="455" y="92" text-anchor="middle" font-size="11">structured tables</text>
<line x1="455" y1="100" x2="455" y2="130" class="condash" marker-end="url(#arrow)"/>

<rect class="box-teal" x="570" y="30" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="t-title-teal" x="645" y="48" text-anchor="middle" font-size="13">Azure OpenAI</text>
<text class="t-body-teal" x="645" y="66" text-anchor="middle" font-size="11">GPT-4o mini +</text>
<text class="t-body-teal" x="645" y="80" text-anchor="middle" font-size="11">text-embedding-3-</text>
<text class="t-body-teal" x="645" y="94" text-anchor="middle" font-size="11">small</text>
<line x1="645" y1="100" x2="645" y2="130" class="condash" marker-end="url(#arrow)"/>

<rect class="box-gray" x="0" y="130" width="150" height="280" rx="8" stroke-width="0.5"/>
<text class="t-title" x="75" y="154" text-anchor="middle">React frontend</text>
<text class="t-body" x="75" y="176" text-anchor="middle">Submits ticket,</text>
<text class="t-body" x="75" y="192" text-anchor="middle">agent feed, SLO</text>
<text class="t-body" x="75" y="208" text-anchor="middle">dashboard, auth &amp;</text>
<text class="t-body" x="75" y="224" text-anchor="middle">RBAC.</text>
<line x1="150" y1="270" x2="190" y2="270" class="conn" marker-end="url(#arrow)"/>

<rect class="box-gray" x="190" y="130" width="150" height="135" rx="8" stroke-width="0.5"/>
<text class="t-title" x="265" y="150" text-anchor="middle" font-size="13">FastAPI</text>
<text class="t-body" x="265" y="172" text-anchor="middle">REST endpoints,</text>
<text class="t-body" x="265" y="188" text-anchor="middle">auth, validation.</text>

<rect class="box-gray" x="190" y="275" width="150" height="135" rx="8" stroke-width="0.5"/>
<text class="t-title" x="265" y="295" text-anchor="middle" font-size="13">Input guardrails</text>
<text class="t-body" x="265" y="317" text-anchor="middle">Prompt-injection &amp;</text>
<text class="t-body" x="265" y="333" text-anchor="middle">input checks.</text>
<line x1="340" y1="270" x2="380" y2="270" class="conn" marker-end="url(#arrow)"/>

<rect class="box-purple" x="380" y="130" width="150" height="280" rx="8" stroke-width="0.5"/>
<text class="t-title-purple" x="455" y="154" text-anchor="middle">Agent 1</text>
<text class="t-body-purple" x="455" y="176" text-anchor="middle">Classifies the</text>
<text class="t-body-purple" x="455" y="192" text-anchor="middle">ticket and decides</text>
<text class="t-body-purple" x="455" y="208" text-anchor="middle">which route below</text>
<text class="t-body-purple" x="455" y="224" text-anchor="middle">it takes.</text>
<text class="t-body-purple" x="455" y="246" text-anchor="middle" font-size="11">↻ Plan-Act-Check</text>
<text class="t-body-purple" x="455" y="260" text-anchor="middle" font-size="11">≤3x (all agents)</text>
<line x1="530" y1="270" x2="570" y2="270" class="conn" marker-end="url(#arrow)"/>

<rect class="box-purple" x="570" y="130" width="150" height="280" rx="8" stroke-width="0.5"/>
<line x1="570" y1="200" x2="720" y2="200" class="divider"/>
<line x1="570" y1="270" x2="720" y2="270" class="divider"/>
<line x1="570" y1="340" x2="720" y2="340" class="divider"/>
<text class="t-rt" x="645" y="154" text-anchor="middle">RAG only - ~45%</text>
<text class="t-small" x="645" y="172" text-anchor="middle">Agent 2 → Agent 4</text>
<text class="t-rt" x="645" y="224" text-anchor="middle">SQL only - ~10%</text>
<text class="t-small" x="645" y="242" text-anchor="middle">Agent 3 → Agent 4</text>
<text class="t-rt" x="645" y="294" text-anchor="middle">Hybrid - ~32%</text>
<text class="t-small" x="645" y="312" text-anchor="middle">Agent 2+3 → Agent 4</text>
<text class="t-rt" x="645" y="364" text-anchor="middle">Multi-agent - ~13%</text>
<text class="t-small" x="645" y="382" text-anchor="middle">Agent 2+3 → Agent 4 →</text>
<text class="t-small" x="645" y="396" text-anchor="middle">Agent 5</text>
<line x1="720" y1="270" x2="760" y2="270" class="conn" marker-end="url(#arrow)"/>

<rect class="box-gray" x="760" y="130" width="150" height="280" rx="8" stroke-width="0.5"/>
<text class="t-title" x="835" y="154" text-anchor="middle">Output guardrails</text>
<text class="t-body" x="835" y="176" text-anchor="middle">Citation/</text>
<text class="t-body" x="835" y="192" text-anchor="middle">groundedness check,</text>
<text class="t-body" x="835" y="208" text-anchor="middle">confidence-based</text>
<text class="t-body" x="835" y="224" text-anchor="middle">escalation. Every</text>
<text class="t-body" x="835" y="240" text-anchor="middle">route arrives here.</text>
<line x1="910" y1="270" x2="950" y2="270" class="conn" marker-end="url(#arrow)"/>

<rect class="box-gray" x="950" y="130" width="150" height="280" rx="8" stroke-width="0.5"/>
<text class="t-title" x="1025" y="154" text-anchor="middle">Langfuse</text>
<text class="t-body" x="1025" y="176" text-anchor="middle">Tracing, prompt</text>
<text class="t-body" x="1025" y="192" text-anchor="middle">management,</text>
<text class="t-body" x="1025" y="208" text-anchor="middle">golden-set evals,</text>
<text class="t-body" x="1025" y="224" text-anchor="middle">SLO dashboards.</text>
<line x1="1100" y1="270" x2="1140" y2="270" class="conn" marker-end="url(#arrow)"/>

<rect class="box-success" x="1140" y="133" width="150" height="134" rx="8" stroke-width="0.5"/>
<text class="t-title-success" x="1215" y="159" text-anchor="middle">Resolved</text>
<text class="t-body-success" x="1215" y="181" text-anchor="middle">~87% - loops</text>
<text class="t-body-success" x="1215" y="197" text-anchor="middle">back above</text>

<rect class="box-danger" x="1140" y="273" width="150" height="134" rx="8" stroke-width="0.5"/>
<text class="t-title-danger" x="1215" y="299" text-anchor="middle">Escalated</text>
<text class="t-body-danger" x="1215" y="321" text-anchor="middle">~13% - to human</text>
<text class="t-body-danger" x="1215" y="337" text-anchor="middle">teams</text>
<line x1="1290" y1="340" x2="1330" y2="340" class="conn" marker-end="url(#arrow)"/>

<rect class="box-danger" x="1330" y="270" width="150" height="140" rx="8" stroke-width="0.5"/>
<text class="t-title-danger" x="1405" y="294" text-anchor="middle">Escalation</text>
<text class="t-body-danger" x="1405" y="316" text-anchor="middle">Human teams: SRE,</text>
<text class="t-body-danger" x="1405" y="332" text-anchor="middle">Identity, Backend,</text>
<text class="t-body-danger" x="1405" y="348" text-anchor="middle">Platform, Data Eng,</text>
<text class="t-body-danger" x="1405" y="364" text-anchor="middle">Account Mgmt.</text>

<rect class="box-gray" x="40" y="430" width="14" height="14" rx="2" stroke-width="0.5"/>
<text class="t-body" x="62" y="437" dominant-baseline="central">Infrastructure (entry &amp; exit checks)</text>
<rect class="box-purple" x="340" y="430" width="14" height="14" rx="2" stroke-width="0.5"/>
<text class="t-body" x="362" y="437" dominant-baseline="central">AI core (Agent 1, routing, Agent 4/5)</text>
<rect class="box-teal" x="660" y="430" width="14" height="14" rx="2" stroke-width="0.5"/>
<text class="t-body" x="682" y="437" dominant-baseline="central">Data &amp; AI services</text>
<rect class="box-success" x="900" y="430" width="14" height="14" rx="2" stroke-width="0.5"/>
<text class="t-body" x="922" y="437" dominant-baseline="central">Resolved - loops back to user</text>
<rect class="box-danger" x="1190" y="430" width="14" height="14" rx="2" stroke-width="0.5"/>
<text class="t-body" x="1212" y="437" dominant-baseline="central">Escalated / Escalation</text>
</svg>
